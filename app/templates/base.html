<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LiftAssist{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
  <style>
    :root {
      --pico-primary: #F26B1D;
      --pico-primary-background: #F26B1D;
      --pico-primary-border: #F26B1D;
      --pico-primary-hover: #d95a10;
      --pico-primary-hover-background: #d95a10;
      --pico-primary-hover-border: #d95a10;
      --pico-primary-focus: rgba(242, 107, 29, 0.35);
      --pico-primary-inverse: #fff;
    }
    .brand { font-weight: 800; color: #F26B1D; text-decoration: none; }
    nav form { margin: 0; }
    nav .link-button {
      background: none; border: none; padding: 0; margin: 0; width: auto;
      color: var(--pico-primary); text-decoration: underline; cursor: pointer;
    }
    .nav-email { font-size: 0.875rem; color: var(--pico-muted-color); overflow-wrap: anywhere; }
    .flash { padding: 0.75rem 1rem; border-radius: var(--pico-border-radius); margin-bottom: 1rem;
             background: var(--pico-card-background-color); border-left: 4px solid #F26B1D; }
    .form-error { color: var(--pico-del-color); font-size: 0.875rem; margin-top: -0.5rem; display: block; }
    main.container { max-width: 32rem; }
  </style>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a class="brand" href="{{ url_for('main.home') }}">LiftAssist</a></li></ul>
      <ul>
        {% if current_user.is_authenticated %}
          <li class="nav-email">{{ current_user.email }}</li>
          <li>
            <form method="post" action="{{ url_for('auth.logout') }}">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button type="submit" class="link-button">Log out</button>
            </form>
          </li>
        {% else %}
          <li><a href="{{ url_for('auth.login') }}">Log in</a></li>
          <li><a href="{{ url_for('auth.signup') }}">Sign up</a></li>
        {% endif %}
      </ul>
    </nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}<div class="flash" role="status">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
