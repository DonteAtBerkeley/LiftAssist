{% extends "base.html" %}
{% from "workouts/_macros.html" import card %}
{% block title %}Workouts · LiftAssist{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Workouts</h1>
  <a href="{{ url_for('workouts.new') }}" role="button">+ New workout</a>
</div>

{% for w in workouts %}
  {{ card(w, starred) }}
{% else %}
  <article>
    <p>No workouts yet.</p>
    <a href="{{ url_for('workouts.new') }}" role="button">Log your first workout</a>
  </article>
{% endfor %}
{% endblock %}
